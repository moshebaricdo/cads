<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
        color: var(--cads-text-neutral-primary);
        background: var(--cads-background-neutral-primary);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        position: relative;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .muted {
        color: var(--cads-text-neutral-tertiary);
      }
      .small {
        font-size: 10px;
      }
      strong {
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }

      /* CADS light semantic values (baked — plugin iframe has no variables.css). */
      :root {
        --cads-background-neutral-primary: #ffffff;
        --cads-background-neutral-secondary: #f1f2f4;
        --cads-background-neutral-tertiary: #e1e3e6;
        --cads-background-neutral-quaternary: #d3d6da;
        --cads-background-neutral-quinary: #b7bcc2;
        --cads-background-neutral-senary: #87909a;
        --cads-background-neutral-alpha-5: #1212120d;
        --cads-background-neutral-alpha-10: #1212121a;
        --cads-background-neutral-alpha-20: #12121233;
        --cads-background-neutral-alpha-40: #12121266;
        --cads-background-brand-primary: #4c42cf;
        --cads-background-brand-strong: #2b1e9f;
        --cads-background-brand-mid: #aca8ea;
        --cads-background-brand-light: #e4e2f8;
        --cads-background-error-primary: #eb1414;
        --cads-background-error-light: #ffdada;
        --cads-background-success-primary: #258830;
        --cads-background-success-light: #d8ffdc;
        --cads-background-selected-primary: #2b1e9f; /* brand-purple-80 */
        --cads-background-selected-strong: #1f1976; /* brand-purple-95 */
        --cads-text-neutral-primary: #121212;
        --cads-text-neutral-secondary: #363b40;
        --cads-text-neutral-tertiary: #4b5258;
        --cads-text-neutral-quaternary: #596069;
        --cads-text-neutral-placeholder: #9ea5ad;
        --cads-text-neutral-primary-inverse: #ffffff;
        --cads-text-brand-primary: #4c42cf;
        --cads-text-error-primary: #eb1414;
        --cads-text-error-secondary: #b30f0f;
        --cads-text-success-primary: #258830;
        --cads-text-success-secondary: #17541e;
        --cads-text-selected-primary: #d8ffdc; /* sentiment-success-5 */
        --cads-text-on-brand: var(--cads-text-neutral-primary-inverse);
        --cads-border-neutral-primary: #d3d6da;
        --cads-border-neutral-secondary: #9ea5ad;
        --cads-border-brand-primary: #4c42cf;
        --cads-border-brand-strong: #3228b7;
        --cads-border-selected-primary: #2b1e9f; /* brand-purple-80 */
        --cads-border-selected-strong: #1f1976; /* brand-purple-95 */
        --cads-border-error-primary: #eb1414;

        /* Short aliases used by existing rules */
        --cads-purple: var(--cads-background-brand-primary);
        --cads-purple-hover: var(--cads-background-brand-strong);
        --cads-purple-disabled: var(--cads-background-brand-mid);
      }

      .icon-btn {
        flex: none;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        color: var(--cads-text-neutral-primary);
      }
      .icon-btn:hover {
        background: var(--cads-background-neutral-tertiary);
      }
      .icon-btn svg {
        display: block;
      }

      .banner {
        margin: 8px 12px 0;
        padding: 7px 10px;
        border-radius: 6px;
        background: var(--cads-background-error-light);
        color: var(--cads-text-error-secondary);
        display: none;
        flex: none;
      }
      .banner.show {
        display: block;
      }

      .main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .main.centered {
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        overflow-y: auto;
      }

      /* Shared page shell (audit / category / fixes) */
      .app-page {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        width: 100%;
        background: var(--cads-background-neutral-primary);
      }
      .app-page-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 12px;
        background: var(--cads-background-neutral-secondary);
      }
      .app-page-footer {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
      }
      .app-page-footer .btn {
        width: 100%;
        min-width: 0;
      }

      .status-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
        flex: none;
      }
      .footer-status {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        color: var(--cads-text-neutral-tertiary);
        font-size: 11px;
      }
      .footer-status .check {
        flex: none;
        width: 14px;
        height: 14px;
        color: var(--cads-text-neutral-tertiary);
      }
      .footer-status strong {
        color: var(--cads-text-neutral-tertiary);
        font-weight: 600;
      }
      .footer-clear {
        margin: -4px -6px;
        padding: 4px 6px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--cads-text-neutral-tertiary);
        cursor: pointer;
      }
      .footer-clear:hover {
        background: var(--cads-background-neutral-tertiary);
        color: var(--cads-text-neutral-primary);
      }
      .status-footer .icon-btn {
        color: var(--cads-text-neutral-tertiary);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 6px;
        border: 1px solid var(--cads-border-neutral-secondary);
        background: var(--cads-background-neutral-primary);
        color: var(--cads-text-neutral-primary);
        cursor: pointer;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--cads-border-neutral-secondary);
        background: var(--cads-background-neutral-secondary);
      }
      .btn:disabled {
        cursor: default;
      }
      .btn.primary {
        background: var(--cads-background-brand-primary);
        border-color: var(--cads-background-brand-primary);
        color: var(--cads-text-on-brand);
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--cads-background-brand-strong);
        border-color: var(--cads-background-brand-strong);
      }
      .btn.brand {
        background: var(--cads-background-brand-primary);
        border-color: var(--cads-background-brand-primary);
        color: var(--cads-text-on-brand);
        border-radius: 10px;
        padding: 11px 18px;
        font-size: 12px;
        font-weight: 600;
        min-width: 160px;
      }
      .btn.brand:hover:not(:disabled) {
        background: var(--cads-background-brand-strong);
        border-color: var(--cads-background-brand-strong);
      }
      .btn.brand:disabled {
        background: var(--cads-background-brand-mid);
        border-color: var(--cads-background-brand-mid);
        color: var(--cads-text-on-brand);
        opacity: 1;
      }
      .btn.brand.compact {
        min-width: 0;
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 11px;
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover:not(:disabled) {
        background: var(--cads-background-neutral-tertiary);
      }
      .btn.block {
        width: 100%;
      }

      /* Hero states (loading / ready) */
      .hero {
        width: 100%;
        max-width: 280px;
        text-align: center;
      }
      .hero-icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: var(--cads-background-neutral-quinary);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cads-text-neutral-primary-inverse);
      }
      .hero-icon.pass {
        background: var(--cads-background-success-primary);
        color: var(--cads-text-neutral-primary-inverse);
      }
      .hero-icon.warn {
        background: var(--cads-background-neutral-senary);
        color: var(--cads-text-neutral-primary-inverse);
      }
      .hero h2 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .hero p {
        margin: 0;
        color: var(--cads-text-neutral-tertiary);
        line-height: 1.4;
        font-size: 12px;
      }
      .hero .cta {
        margin-top: 22px;
      }
      .hero-progress {
        margin: 22px auto 0;
        max-width: 220px;
      }
      .hero-progress .bar {
        height: 8px;
        border-radius: 999px;
        background: var(--cads-background-neutral-tertiary);
        overflow: hidden;
      }
      .hero-progress .bar > div {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: var(--cads-background-brand-primary);
        transition: width 0.15s ease;
      }
      .hero-progress .meta {
        margin-top: 8px;
        color: var(--cads-text-neutral-placeholder);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .icon-spin {
        animation: icon-spin 0.85s linear infinite;
      }
      @keyframes icon-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .icon-rotate-neg90 {
        transform: rotate(-90deg);
      }

      /* Shared topbar chrome (audit / category / fixes) */
      .app-topbar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 10px;
        border-bottom: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
        flex: none;
      }
      .app-topbar-copy {
        display: flex;
        flex: 1;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .app-topbar-title {
        margin: 0;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-size: 12px;
        font-weight: 650;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .app-topbar-actions {
        display: flex;
        flex: none;
        align-items: center;
        gap: 4px;
      }
      .app-topbar-count {
        color: var(--cads-text-error-primary);
        font-size: 9px;
        font-weight: 650;
        white-space: nowrap;
      }
      .app-topbar-count.pass {
        color: var(--cads-text-success-primary);
      }
      .app-topbar .btn {
        height: 28px;
        padding: 0 10px;
        font-size: 11px;
      }

      /* Audit overview */
      .audit-target-label {
        flex: none;
        color: var(--cads-text-neutral-tertiary);
        font-size: 11px;
        line-height: 1.3;
      }
      .audit-target-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        font-weight: 600;
        line-height: 1.3;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .score-card {
        overflow: hidden;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 10px;
        background: var(--cads-background-neutral-primary);
      }
      .score-main {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
      }
      .score-ring {
        --score: 0;
        position: relative;
        flex: none;
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(
          var(--cads-background-brand-primary) calc(var(--score) * 1%),
          var(--cads-background-neutral-secondary) 0
        );
      }
      .score-ring::before {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: var(--cads-background-neutral-primary);
        content: "";
      }
      .score-value {
        position: relative;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .score-copy {
        flex: 1;
        min-width: 0;
      }
      .score-copy h2 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .score-copy p {
        margin: 0;
        color: var(--cads-text-neutral-tertiary);
        font-size: 11px;
        line-height: 1.4;
      }
      .score-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
      }
      .score-stat {
        padding: 9px 10px;
        text-align: center;
      }
      .score-stat + .score-stat {
        border-left: 1px solid var(--cads-border-neutral-primary);
      }
      .score-stat-value {
        font-size: 13px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .score-stat-label {
        margin-top: 2px;
        color: var(--cads-text-neutral-tertiary);
        font-size: 9px;
        line-height: 1.2;
      }
      .score-stat.warning .score-stat-value {
        color: var(--cads-text-error-primary);
      }
      .score-stat.pass .score-stat-value {
        color: var(--cads-text-success-primary);
      }
      .category-heading {
        margin: 14px 2px 7px;
        color: var(--cads-text-neutral-tertiary);
        font-size: 10px;
        font-weight: 600;
      }
      .category-cards {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .category-card {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 42px;
        padding: 6px 9px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        background: var(--cads-background-neutral-primary);
        text-align: left;
      }
      .category-card.interactive {
        cursor: pointer;
      }
      .category-card.interactive:hover {
        border-color: var(--cads-border-neutral-secondary);
      }
      .category-card.interactive:focus-visible {
        outline: 2px solid var(--cads-border-brand-strong);
        outline-offset: 1px;
      }
      .category-icon {
        flex: none;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: var(--cads-background-neutral-senary);
        color: var(--cads-text-neutral-primary-inverse);
      }
      .category-icon.warning {
        background: var(--cads-background-neutral-senary);
        color: var(--cads-text-neutral-primary-inverse);
      }
      .category-icon.pass {
        background: var(--cads-background-success-primary);
        color: var(--cads-text-neutral-primary-inverse);
      }
      .category-copy {
        flex: 1;
        min-width: 0;
      }
      .category-title {
        font-weight: 600;
      }
      .category-status {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        font-weight: 600;
      }
      .category-status.pass {
        color: var(--cads-text-success-primary);
      }
      .category-status.warning {
        color: var(--cads-text-error-primary);
      }
      .category-chevron {
        flex: none;
        color: var(--cads-text-neutral-placeholder);
      }

      /* Category detail — CADS SegmentedButton (small) */
      .detail-tabs {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin: 0 0 12px;
        padding: 0;
        overflow: hidden;
        border-radius: 6px; /* --shape-sm */
        background: transparent;
        border: 0;
      }
      .detail-tab {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        justify-content: center;
        gap: 8px;
        z-index: 0;
        min-height: 32px;
        padding: 5px 10px;
        border: 1px solid var(--cads-border-neutral-secondary);
        border-radius: 0;
        background: var(--cads-background-neutral-primary);
        color: var(--cads-text-neutral-primary);
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .detail-tab:not(:first-child) {
        margin-left: -1px;
      }
      .detail-tab:first-child {
        border-radius: 6px 0 0 6px;
      }
      .detail-tab:last-child {
        border-radius: 0 6px 6px 0;
      }
      .detail-tab:hover {
        z-index: 2;
        background: var(--cads-background-neutral-tertiary);
        border-color: var(--cads-border-neutral-secondary);
        color: var(--cads-text-neutral-primary);
      }
      .detail-tab[aria-selected="true"] {
        z-index: 1;
        background: var(--cads-background-selected-primary);
        border-color: var(--cads-border-selected-primary);
        color: var(--cads-text-selected-primary);
        box-shadow: none;
      }
      .detail-tab[aria-selected="true"]:hover {
        z-index: 2;
        background: var(--cads-background-selected-primary);
        border-color: var(--cads-border-selected-strong);
        color: var(--cads-text-selected-primary);
      }
      .warning-groups {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .warning-group-header {
        padding: 0 2px 7px;
      }
      .warning-group-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .warning-group-header h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 550;
      }
      .warning-group-count {
        min-width: 17px;
        padding: 1px 5px;
        border-radius: 999px;
        background: var(--cads-background-error-light);
        color: var(--cads-text-error-secondary);
        font-size: 9px;
        font-weight: 650;
        text-align: center;
      }
      .warning-list {
        overflow: hidden;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        background: var(--cads-background-neutral-primary);
      }
      .warning-card + .warning-card {
        border-top: 1px solid var(--cads-border-neutral-primary);
      }
      .include-hidden-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        padding: 8px 10px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        background: var(--cads-background-neutral-secondary);
        color: var(--cads-text-neutral-secondary);
        font-size: 10px;
        font-weight: 550;
        cursor: pointer;
      }
      .include-hidden-row input {
        margin: 0;
      }
      .hidden-layers-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        margin-top: 5px;
        padding: 6px 8px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--cads-text-neutral-tertiary);
        cursor: pointer;
        font-size: 9px;
        font-weight: 600;
        text-align: left;
      }
      .hidden-layers-toggle:hover {
        background: var(--cads-background-neutral-tertiary);
        color: var(--cads-text-neutral-primary);
      }
      .hidden-layers-toggle svg {
        transition: transform 0.12s ease;
      }
      .hidden-layers-toggle[aria-expanded="true"] svg {
        transform: rotate(180deg);
      }
      .hidden-warning-list {
        margin-top: 5px;
        opacity: 0.78;
      }
      .warning-trigger {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 6px 9px;
        border: 0;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      .warning-trigger:focus-visible {
        position: relative;
        z-index: 1;
        outline: 2px solid var(--cads-border-brand-strong);
        outline-offset: -2px;
      }
      .warning-trigger .swatches {
        width: 24px;
        justify-content: center;
      }
      .warning-trigger .swatch {
        width: 16px;
        height: 16px;
        border-radius: 5px;
      }
      .warning-mode-icon {
        flex: none;
        width: 24px;
        height: 24px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: var(--cads-background-neutral-senary);
        color: var(--cads-text-neutral-primary-inverse);
      }
      .warning-copy {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-width: 0;
      }
      .warning-name-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }
      .warning-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 400;
        min-width: 0;
      }
      .warning-name-row .combo-option-value {
        flex: none;
      }
      .warning-suggest {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
        margin-top: 2px;
        color: var(--cads-text-neutral-tertiary);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.3;
      }
      .warning-suggest-arrow {
        flex: none;
        display: inline-flex;
        color: var(--cads-text-neutral-quaternary);
      }
      .warning-suggest-target {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--cads-text-brand-primary);
      }
      .warning-suggest-none {
        color: var(--cads-text-neutral-quaternary);
        font-style: italic;
      }
      .warning-count {
        flex: none;
        color: var(--cads-text-error-primary);
        font-size: 9px;
        font-weight: 600;
      }
      .warning-chevron {
        flex: none;
        color: var(--cads-text-neutral-placeholder);
        transition: transform 0.12s ease;
      }
      .warning-layers {
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-secondary);
      }
      .warning-layer {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 5px 6px 5px 12px;
      }
      .warning-layer + .warning-layer {
        border-top: 1px solid var(--cads-border-neutral-primary);
      }
      .warning-layer-icon {
        flex: none;
        width: 20px;
        height: 20px;
        display: grid;
        place-items: center;
        border-radius: 5px;
        background: var(--cads-background-neutral-primary);
        color: var(--cads-text-neutral-tertiary);
      }
      .warning-layer-copy {
        display: flex;
        flex: 1;
        align-items: center;
        min-width: 0;
      }
      .warning-layer-name {
        overflow: hidden;
        font-size: 10px;
        font-weight: 550;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .warning-locate {
        flex: none;
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--cads-text-neutral-tertiary);
        cursor: pointer;
      }
      .warning-locate:hover {
        background: var(--cads-background-neutral-tertiary);
        color: var(--cads-text-neutral-primary);
      }
      .warning-locate:focus-visible {
        outline: 2px solid var(--cads-border-brand-strong);
        outline-offset: 1px;
      }
      .detail-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin-top: 12px;
        padding: 24px 16px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        color: var(--cads-text-neutral-tertiary);
        text-align: center;
      }
      .detail-empty .check {
        width: 22px;
        height: 22px;
        margin-bottom: 3px;
        color: var(--cads-text-success-primary);
      }
      .detail-empty strong {
        color: var(--cads-text-neutral-primary);
      }
      .detail-suggest {
        padding: 9px 14px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .detail-suggest svg {
        flex-shrink: 0;
      }
      .detail-suggest.detail-suggest-busy {
        min-width: 44px;
        padding-left: 14px;
        padding-right: 14px;
      }
      .detail-footer-note {
        margin: 0;
        color: var(--cads-text-neutral-tertiary);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.35;
      }

      .finding-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 0;
        border-bottom: 1px solid var(--cads-border-neutral-primary);
      }
      .finding-row:last-child {
        border-bottom: none;
      }
      .finding-row .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .count {
        flex: none;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--cads-background-neutral-secondary);
        color: var(--cads-text-neutral-tertiary);
        font-variant-numeric: tabular-nums;
      }
      .pill {
        flex: none;
        padding: 1px 6px;
        border-radius: 999px;
        font-size: 9px;
        font-weight: 600;
      }
      .pill.ok {
        background: var(--cads-background-success-light);
        color: var(--cads-text-success-secondary);
      }
      .pill.warn {
        background: var(--cads-background-error-light);
        color: var(--cads-text-error-secondary);
      }
      .pill.info {
        background: var(--cads-background-neutral-secondary);
        color: var(--cads-text-neutral-tertiary);
      }
      .swatches {
        display: flex;
        flex: none;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 1px solid var(--cads-border-neutral-primary);
        margin-right: -3px;
      }
      .more {
        padding: 6px 0 0;
        color: var(--cads-text-neutral-tertiary);
      }

      /* Fix panel — same flex slot as #main (not a full-app overlay) */
      .panel {
        display: none;
      }
      .panel.show {
        display: flex;
      }

      .fix-section {
        margin-bottom: 16px;
      }
      .fix-section:last-child {
        margin-bottom: 0;
      }
      .fix-list.warning-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      .fix-card {
        overflow: hidden;
        padding: 0;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        background: var(--cads-background-neutral-primary);
      }
      .fix-card.excluded {
        opacity: 0.5;
      }
      .fix-card-top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 6px 9px;
      }
      .fix-card-top input {
        flex: none;
        margin: 0;
      }
      .fix-card-source {
        flex: 1;
        min-width: 0;
      }
      .fix-card-name-row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .fix-card-name-row .combo-option-value {
        flex: none;
      }
      .fix-card-name-row .var-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 400;
      }
      .fix-expand {
        display: flex;
        flex: none;
        align-items: center;
        gap: 3px;
        min-height: 26px;
        padding: 3px 4px 3px 6px;
        border: 0;
        border-radius: 5px;
        background: var(--cads-background-neutral-primary);
        color: var(--cads-text-neutral-tertiary);
        cursor: pointer;
      }
      .fix-expand:hover {
        background: var(--cads-background-neutral-tertiary);
        color: var(--cads-text-neutral-primary);
      }
      .fix-expand[aria-expanded="true"] .warning-chevron {
        transform: rotate(180deg);
      }
      .fix-card-target {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 9px;
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
      }
      .fix-card-target .arrow {
        flex: none;
        display: grid;
        place-items: center;
        width: 13px;
        color: var(--cads-text-neutral-tertiary);
      }
      .fix-usage-list {
        overflow: hidden;
        margin: 0;
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-secondary);
      }
      .fix-usage-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 34px;
        padding: 4px 6px 4px 9px;
      }
      .fix-usage-row + .fix-usage-row {
        border-top: 1px solid var(--cads-border-neutral-primary);
      }
      .fix-usage-row > input {
        flex: none;
        margin: 0;
      }
      .fix-usage-row .warning-layer-name {
        flex: 1;
        min-width: 0;
      }

      .combo {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .combo-trigger {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 7px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 5px;
        background: var(--cads-background-neutral-primary);
        cursor: pointer;
        text-align: left;
      }
      .combo-trigger.locked {
        cursor: default;
        pointer-events: none;
        opacity: 0.95;
      }
      .combo-trigger:hover {
        border-color: var(--cads-border-neutral-secondary);
        background: var(--cads-background-neutral-secondary);
      }
      .combo-trigger .value {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .combo-trigger .value.placeholder {
        color: var(--cads-text-neutral-placeholder);
      }
      .combo-menu {
        position: fixed;
        z-index: 40;
        width: 280px;
        max-height: 240px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        overflow: hidden;
        background: var(--cads-background-neutral-primary);
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        box-shadow: 0 4px 14px var(--cads-background-neutral-alpha-20);
      }
      .combo-menu input {
        width: calc(100% - 12px);
        box-sizing: border-box;
        margin: 6px;
        padding: 5px 7px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 5px;
        background: var(--cads-background-neutral-secondary);
        color: inherit;
        font: inherit;
        outline: none;
      }
      .combo-menu .options {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-bottom: 4px;
      }
      .combo-divider {
        height: 1px;
        margin: 4px 8px;
        background: var(--cads-border-neutral-primary);
      }
      .combo-option {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        padding: 5px 8px;
        border: none;
        background: none;
        cursor: pointer;
        text-align: left;
      }
      .combo-option:hover {
        background: var(--cads-background-neutral-secondary);
      }
      .combo-option.is-selected {
        background: var(--cads-background-selected-strong);
        color: var(--cads-text-selected-primary);
      }
      .combo-option.is-selected:hover {
        background: var(--cads-background-selected-strong);
        color: var(--cads-text-selected-primary);
      }
      .combo-option.is-selected .combo-option-value,
      .combo-option.is-selected .combo-recommended {
        color: var(--cads-text-selected-primary);
      }
      .combo-option .value {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .combo-option-main {
        display: flex;
        flex: 1;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
      }
      .combo-option-value {
        flex: none;
        color: var(--cads-text-neutral-tertiary);
        font-size: 9px;
      }
      .combo-recommended {
        flex: none;
        color: var(--cads-text-neutral-tertiary);
        font-size: 9px;
        font-weight: 600;
      }
      .combo-footer {
        flex: none;
        padding: 3px 6px;
        border-top: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
      }
      .combo-skip {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 24px;
        padding: 3px 8px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: var(--cads-text-neutral-tertiary);
        cursor: pointer;
        font: inherit;
        font-weight: 550;
      }
      .combo-skip:hover {
        background: var(--cads-background-neutral-tertiary);
        color: var(--cads-text-neutral-primary);
      }

      .mode-hint {
        margin: -2px 2px 8px;
        line-height: 1.35;
      }
      .mode-panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 8px 10px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 8px;
        background: var(--cads-background-neutral-primary);
      }
      .mode-panel-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mode-panel-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 28px;
      }
      .mode-panel-row > input {
        flex: none;
        margin: 0;
      }
      .mode-panel-row > span:last-child {
        flex: 1;
        min-width: 0;
      }

      .radio-row {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 8px;
        border: 1px solid var(--cads-border-neutral-primary);
        border-radius: 6px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      .radio-row.selected {
        border-color: var(--cads-border-brand-primary);
        background: var(--cads-background-brand-light);
      }
      .radio-row .lib-name {
        font-weight: 600;
      }
      .failure {
        padding: 6px 8px;
        border-radius: 5px;
        background: var(--cads-background-error-light);
        margin-bottom: 5px;
      }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: var(--cads-background-neutral-alpha-40);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
      }
      .modal-backdrop.show {
        display: flex;
      }
      .modal {
        width: 320px;
        max-height: 90%;
        overflow-y: auto;
        background: var(--cads-background-neutral-primary);
        border-radius: 8px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .modal h3 {
        margin: 0;
        font-size: 12px;
      }
      .modal.confirm {
        width: 300px;
        padding: 16px;
        gap: 8px;
      }
      .modal.confirm p {
        margin: 0;
        color: var(--cads-text-neutral-tertiary);
        font-size: 11px;
        line-height: 1.45;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 7px;
        margin-top: 6px;
      }
      .modal-actions.split {
        justify-content: space-between;
        align-items: center;
      }
      .modal-actions-right {
        display: flex;
        gap: 7px;
      }
      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 2px;
      }
      .settings-section h4 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--cads-text-neutral-primary);
      }
      .settings-section > .muted {
        margin: 0;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field > label {
        font-size: 11px;
        color: var(--cads-text-neutral-tertiary);
      }
      .field input {
        padding: 6px 8px;
        border-radius: 5px;
        border: 1px solid var(--cads-border-neutral-primary);
        background: var(--cads-background-neutral-primary);
        color: inherit;
        font: inherit;
        outline: none;
      }
      .field .combo-trigger {
        padding: 6px 8px;
      }

    <div id="app">
      <div class="banner" id="banner"></div>

      <div class="main centered" id="main"></div>

      <!-- Fix panel — sibling of #main in the same flex slot above the status footer -->
      <div class="app-page panel" id="fix-panel">
        <div class="app-topbar">
          <button class="icon-btn" id="fix-back" title="Back" aria-label="Back"></button>
          <span class="app-topbar-title" id="fix-title">Review fixes</span>
          <div class="app-topbar-actions">
            <button class="icon-btn" id="fix-expand-all" title="Expand all usages" aria-label="Expand all usages"></button>
          </div>
        </div>
        <div class="app-page-body" id="fix-body"></div>
        <div class="app-page-footer">
          <button class="btn brand" id="apply-btn" disabled>Apply</button>
        </div>
      </div>

      <div class="status-footer" id="footer">
        <div class="footer-status" id="footer-status">Initializing…</div>
        <button class="icon-btn" id="ai-settings-btn" title="Plugin settings" aria-label="Plugin settings"></button>
      </div>

    </div>

    <div class="modal-backdrop" id="ai-modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h3 id="settings-title">Plugin settings</h3>
        <section class="settings-section" aria-labelledby="ai-settings-heading">
          <h4 id="ai-settings-heading">AI settings</h4>
          <p class="muted small" id="ai-settings-hint">
            Optional. Your key stays in Figma client storage; calls go straight to
            the provider.
          </p>
          <div class="field">
            <label id="ai-provider-label">Provider</label>
            <div class="combo">
              <button
                type="button"
                class="combo-trigger"
                id="ai-provider-trigger"
                aria-labelledby="ai-provider-label"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="value" id="ai-provider-value">Anthropic</span>
                <span class="muted">▾</span>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="ai-model">Model</label>
            <input id="ai-model" type="text" spellcheck="false" />
          </div>
          <div class="field">
            <label for="ai-key">API key</label>
            <input id="ai-key" type="password" spellcheck="false" />
          </div>
        </section>
        <div class="modal-actions split">
          <button class="btn" id="ai-cancel" type="button">Cancel</button>
          <div class="modal-actions-right">
            <button class="btn" id="ai-clear" type="button">Clear</button>
            <button class="btn primary" id="ai-save" type="button">Save</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="reaudit-modal">
      <div class="modal confirm" role="dialog" aria-modal="true" aria-labelledby="reaudit-title">
        <h3 id="reaudit-title">Audit the new selection?</h3>
        <p id="reaudit-message"></p>
        <div class="modal-actions">
          <button class="btn" id="reaudit-cancel">Cancel</button>
          <button class="btn brand compact" id="reaudit-confirm">Run audit</button>
        </div>
      </div>
    </div>
